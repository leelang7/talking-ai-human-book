<!doctype html>
<meta charset="utf-8">
<title>Ch18 — VRM 최소 뷰어</title>
<!--
  Ch18 §3~§5 를 브라우저에서 그대로 하는 최소 구현.
  저자의 실제 뷰어에서 VRM 경로만 남기고 잘라낸 것이다.

  요점은 셋이고, rig.py 가 같은 규칙을 파이썬으로 검증한다.
    · 뼈는 표준 이름으로만 부른다 (getNormalizedBoneNode)
    · 로드 직후 휴식 포즈를 복사해 두고, 이후엔 거기에 더하기만 한다 (rotg)
    · 모델 크기는 뼈 위치로 재고, 단위가 이상하면 정규화한다 (frameModel)

  라이브러리는 로컬에 둔다 (§3). CDN 이 바뀌거나 사라져도 이 파일은 그대로 돈다.
    ./lib/three.module.js
    ./lib/GLTFLoader.js
    ./lib/three-vrm.module.js
-->
<style>
  body { margin:0; background:#111; color:#ddd; font-family:system-ui, sans-serif; }
  #wrap { display:grid; grid-template-rows:1fr auto; height:100vh; }
  canvas { display:block; width:100%; height:100%; }
  #bar { padding:8px 12px; display:flex; gap:10px; align-items:center; font-size:13px; }
  select, button { padding:6px 10px; }
  #st { color:#9aa; }
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="bar">
    <select id="model">
      <option value="avatar.vrm">avatar.vrm</option>
      <option value="avatar_f.vrm">avatar_f.vrm</option>
      <option value="avatar_m.vrm">avatar_m.vrm</option>
    </select>
    <button id="nod">고개 끄덕임</button>
    <button id="blink">깜빡</button>
    <span id="st">준비</span>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from './lib/three-vrm.module.js';

const canvas = document.getElementById('c');
const st = document.getElementById('st');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(1, 2, 2); scene.add(key);

// ── ① 표준 뼈 이름 — 코드는 이 이름만 안다 ─────────────────────────
const BONES = ['neck','head','spine','chest','hips',
  'leftShoulder','rightShoulder','leftUpperArm','rightUpperArm',
  'leftLowerArm','rightLowerArm','leftUpperLeg','rightUpperLeg','leftLowerLeg','rightLowerLeg'];

let vrm = null, root = null, bones = {}, restRot = {};

// ── ② 휴식 포즈에 더하기만 한다 (Ch19 §2) ──────────────────────────
function rotg(name, dx = 0, dy = 0, dz = 0) {
  const b = bones[name], r = restRot[name];
  if (b && r) b.rotation.set(r.x + dx, r.y + dy, r.z + dz);
}

// ── ③ 뼈 위치로 키를 재고 단위를 정규화한다 ────────────────────────
function frameModel() {
  root.scale.setScalar(1); root.updateWorldMatrix(true, true);
  const box = new THREE.Box3(), v = new THREE.Vector3(); let n = 0;
  root.traverse(o => { if (o.isBone) { o.getWorldPosition(v); box.expandByPoint(v); n++; } });
  let h = 1.6;
  if (n > 2) {
    const s = new THREE.Vector3(); box.getSize(s);
    h = Math.max(s.x, s.y, s.z) * 1.06;                 // 뼈는 표면보다 안쪽이라 여유
    if (h < 0.5 || h > 4) { root.scale.setScalar(1.6 / h); root.updateWorldMatrix(true, true); h = 1.6; }
  }
  const c = new THREE.Vector3(); box.getCenter(c);
  camera.position.set(c.x, c.y + h * 0.15, c.z + h * 1.4);
  camera.lookAt(c.x, c.y + h * 0.15, c.z);
}

function load(file) {
  if (root) scene.remove(root);
  vrm = null; root = null; bones = {}; restRot = {};
  st.textContent = '로딩…';
  const loader = new GLTFLoader();
  loader.register(p => new VRMLoaderPlugin(p));
  loader.load('./models/' + file, gltf => {
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.removeUnnecessaryJoints(gltf.scene);
    root = vrm.scene; scene.add(root);

    // 있는 뼈만 잡는다. 없다고 죽지 않는다.
    BONES.forEach(n => { const b = vrm.humanoid.getNormalizedBoneNode(n); if (b) bones[n] = b; });
    // 로드 직후의 회전이 원점이다. 이후 모든 동작은 여기에 더한다.
    Object.keys(bones).forEach(n => restRot[n] = bones[n].rotation.clone());

    frameModel();
    st.textContent = `준비 — 뼈 ${Object.keys(bones).length}/15`;
  }, p => { if (p.total) st.textContent = '로딩 ' + Math.round(p.loaded / p.total * 100) + '%'; },
     e => { st.textContent = '로드 실패: ' + (e.message || e); });
}

// ── 시연 — 같은 코드가 어느 모델에서나 같은 동작을 낸다 ───────────────
let nodT = -1, blinkT = -1;
document.getElementById('nod').onclick = () => nodT = 0;
document.getElementById('blink').onclick = () => blinkT = 0;
document.getElementById('model').onchange = e => load(e.target.value);

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (vrm) {
    // 고개 끄덕임 — 사인 반파장이라 양 끝이 0, 이음매가 없다 (Ch19 §3)
    if (nodT >= 0) { nodT += dt; const p = Math.min(1, nodT / 0.6);
      rotg('neck', Math.sin(p * Math.PI) * 0.18); if (p >= 1) nodT = -1; }
    if (blinkT >= 0) { blinkT += dt; const p = Math.min(1, blinkT / 0.3);
      vrm.expressionManager?.setValue('blink', Math.sin(p * Math.PI)); if (p >= 1) blinkT = -1; }
    vrm.update(dt);                                    // 스프링본 — 이 한 줄이 빠지면 머리카락이 굳는다 (Ch19 §9)
  }
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
}
loop();
load('avatar.vrm');
</script>
